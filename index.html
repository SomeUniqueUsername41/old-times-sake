<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subtraction Equation Colorizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: calc(100% - 24px);
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #555;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Super Smash Bros. Damage Percentage Subtraction Equation Colorizer</h2>
    <label for="base-number">Base Number:</label>
    <input type="text" id="base-number" placeholder="Enter base number" />
    <label for="result-number">Resulting Number (0–999):</label>
    <input type="text" id="result-number" placeholder="Enter result number" />
    <div class="result" id="result"></div>
  </div>

  <script>
   function getColorFromRange(val) {
   val = Math.max(0, Math.min(999, val));

   const colors = [
     "rgb(255,255,255)", // 0–49
     "rgb(255,195,195)", // 50–99
     "rgb(255,175,175)", // 100–149
     "rgb(255,140,140)", // 150–199
     "rgb(255,100,100)", // 200–249
     "rgb(255,55,55)",   // 250–299
     "rgb(230,0,0)",     // 300–349
     "rgb(215,0,0)",     // 350–399
     "rgb(180,0,0)",     // 400–449
     "rgb(135,0,0)",     // 450–499
     "rgb(90,0,0)",      // 500–549
     "rgb(50,0,0)",      // 550–599
     "rgb(50,0,0)",      // 600–649
     "rgb(50,0,0)",      // 650–699
     "rgb(50,0,0)",      // 700–749
     "rgb(50,0,0)",      // 750–799
     "rgb(50,0,0)",      // 800–849
     "rgb(50,0,0)",      // 850–899
     "rgb(50,0,0)",      // 900–949
     "rgb(50,0,0)"       // 950–999
   ];

   const index = Math.floor(val / 50);
   return colors[Math.min(index, colors.length - 1)];
 }

    function updateEquation() {
      const baseInput = document.getElementById("base-number").value.replace(/,/g, "");
      const resultInput = document.getElementById("result-number").value.replace(/,/g, "");
      const resultBox = document.getElementById("result");

      if (baseInput.trim() === "" || resultInput.trim() === "" || isNaN(baseInput) || isNaN(resultInput)) {
        resultBox.innerText = "Please enter valid numbers.";
        resultBox.style.color = "black";
        return;
      }

      const base = parseInt(baseInput);
      const result = parseInt(resultInput);
      const total = base + result;

      const color = getColorFromRange(result);
      resultBox.innerText = `(${total} - ${base})%`;
      resultBox.style.color = color;
    }

    document.getElementById("base-number").addEventListener("input", updateEquation);
    document.getElementById("result-number").addEventListener("input", updateEquation);
  </script>
</body>
</html>
